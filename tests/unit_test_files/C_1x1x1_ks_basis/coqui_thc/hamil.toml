[mean_field.qe]
name     = "mf"
prefix   = "pwscf"
outdir   = "../qe/OUT"
nbnd     = 8

[interaction.thc]
name        = "eri"
mean_field  = "mf"
save        = "thc.h5"
thresh      = 1e-6
ecut        = 50.0

[hamiltonian]
mean_field  = "mf"
interaction = "eri"
output      = "ham_thc_1e-6.h5"

[wavefunction.mf]
mean_field  = "mf"
output      = "wfn_mf_pbe.h5"

